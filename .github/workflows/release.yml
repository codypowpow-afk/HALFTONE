name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Package
        run: npm run package:win

      - name: Smoke test (app starts and stays up)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Halftone Press-win32-x64\Halftone Press.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "App exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force

      - name: Zip
        shell: pwsh
        run: |
          Copy-Item "build\READ ME FIRST.txt" "dist\Halftone Press-win32-x64\"
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $zip = "HalftonePress-$version-win-x64.zip"
          Compress-Archive -Path "dist\Halftone Press-win32-x64" -DestinationPath $zip
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  $zip" | Out-File -Encoding ascii "$zip.sha256"
          "ZIP=$zip" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: HalftonePress-win-x64
          path: |
            ${{ env.ZIP }}
            ${{ env.ZIP }}.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "$env:ZIP" "$env:ZIP.sha256" `
            --title "Halftone Press ${{ github.ref_name }}" `
            --notes-file .github/release-notes.md
